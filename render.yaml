services:
  - type: web
    name: interviewai-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run dev
    envVars:
      - key: PORT
        value: 8000
      - key: MONGO_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
